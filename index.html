<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج نشاط مدرسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== قاعدة @page لإزالة هوامش المتصفح ===== */
        @page {
            size: A4;
            margin: 0;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
        }
        
        .page-container {
            width: 210mm; 
            height: 297mm;
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 12mm;
            display: flex; 
            flex-direction: column;
            
            background-image: url('background.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ffffff;
        }

        .content { 
            position: relative; 
            z-index: 2; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            flex: 1; 
            padding-top: 20px;
        }

        /* العنوان */
        .header { 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            margin-bottom: 12px; 
            width: 100%;
        }

        .title-area { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            text-align: center;
            width: 70%;
        }

        .title-row { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 16px; 
            font-weight: 700; 
            color: #333; 
        }

        .title-input { 
            flex: 0 1 auto;
            width: 250px;
            border: none;
            font-family: inherit; 
            font-size: 16px; 
            font-weight: 700; 
            color: #2c5a9c; 
            background: transparent; 
            padding: 2px 8px; 
            outline: none; 
            margin-right: 5px; 
            text-align: right;
        }

        /* الوصف */
        .description-box { 
            border: 2px solid #2c5a9c; 
            border-radius: 12px;
            padding: 10px; 
            margin-bottom: 12px; 
            margin-top: 40px; 
            background-color: rgba(255,255,255,0.85); 
            min-height: 140px;
            text-align: right;
            width: 70%;
            align-self: flex-start;
            margin-right: auto;
        }

        .description-label { 
            font-weight: 700; 
            color: #333; 
            margin-bottom: 4px; 
            font-size: 14px; 
            text-align: right;
        }

        .description-input { 
            width: 100%; 
            border: none; 
            resize: vertical; 
            font-family: inherit; 
            font-size: 13px; 
            color: #333; 
            background: transparent; 
            outline: none; 
            min-height: 100px;
            line-height: 1.5; 
            text-align: right;
        }

        /* شبكة الصور - ارتفاع ثابت لكل صف */
        .images-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: 220px 220px;
            gap: 12px; 
            margin-bottom: 12px; 
            width: 70%;             
            align-self: flex-start; 
            margin-left: 0;         
            margin-right: auto;     
        }

        .image-placeholder { 
            border: 2px solid #2c5a9c; 
            border-radius: 12px; 
            background-color: rgba(245,245,245,0.8); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #999; 
            font-size: 12px; 
            position: relative; 
            overflow: hidden;
            cursor: pointer; 
            transition: all 0.3s ease; 
            height: 100%;
            width: 100%;
        }

        .image-placeholder:hover { 
            background-color: rgba(232,232,232,0.9); 
        }

        .image-placeholder img { 
            width: 100%; 
            height: 100%; 
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            object-position: center;
            position: absolute; 
            top: 0; 
            left: 0; 
            display: none; 
        }

        .image-placeholder.has-image img { 
            display: block; 
        }

        .image-placeholder.has-image .placeholder-text { 
            display: none; 
        }

        .image-placeholder input[type="file"] { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            cursor: pointer; 
            z-index: 3; 
        }

        .placeholder-text { 
            text-align: center; 
            padding: 6px; 
            z-index: 2; 
            font-size: 11px;
        }

        /* التذييل */
        .footer { 
            margin-top: auto; 
            padding-top: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            position: relative; 
        }

        /* حاوية موحدة بإطار */
        .info-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 380px;
            align-self: flex-end;
            margin-right: 0;
            border: 2px solid #2c5a9c;
            border-radius: 12px;
            padding: 8px 12px;
            background-color: rgba(255,255,255,0.85);
        }

        .info-row { 
            display: flex; 
            align-items: center; 
            gap: 4px;
            width: 100%;
            text-align: right;
        }

        .info-label { 
            font-weight: 700; 
            color: #333; 
            font-size: 13px;
            font-family: 'Tajawal', sans-serif;
            white-space: nowrap; 
            min-width: 90px;
            text-align: right;
            flex-shrink: 0;
        }

        .info-input { 
            flex: 1;
            border: none;
            font-family: 'Tajawal', sans-serif; 
            font-size: 13px;
            color: #333; 
            background: transparent; 
            padding: 2px 4px; 
            outline: none; 
            text-align: right; 
        }

        /* حقول التاريخ - قوائم منسدلة */
        .date-input { 
            width: 45px;
            border: none;
            text-align: center; 
            font-family: 'Tajawal', sans-serif; 
            font-size: 12px;
            background: transparent; 
            outline: none; 
            color: #333;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            text-align-last: center;
        }

        .date-select { 
            border: none;
            font-family: 'Tajawal', sans-serif; 
            font-size: 12px;
            background: transparent; 
            outline: none; 
            color: #333; 
            padding: 1px; 
            cursor: pointer; 
            min-width: 65px;
            text-align: right;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .date-separator {
            font-size: 12px;
            color: #333;
            font-family: 'Tajawal', sans-serif;
        }

        /* رائد النشاط */
        .leader-section { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            margin-top: 8px; 
            width: 100%;
            position: relative;
        }

        .leader-section .checkbox-container {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .leader-section .hidden-input.visible {
            display: inline-block;
            position: absolute;
            right: calc(50% + 80px);
            top: 50%;
            transform: translateY(-50%);
            width: 220px;
        }

        /* مدير المدرسة */
        .manager-section { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 6px; 
            margin-top: 8px; 
            width: auto;
            margin-right: auto;
            margin-left: 0;
            order: 3;
        }

        .manager-label {
            font-weight: 700; 
            color: #333; 
            font-size: 14px; 
            font-family: 'Tajawal', sans-serif;
            white-space: nowrap;
            min-width: 90px;
            text-align: right;
        }

        .manager-input {
            width: 220px; 
            border: none;
            font-family: 'Tajawal', sans-serif; 
            font-size: 14px; 
            color: #333; 
            background: transparent; 
            padding: 2px 4px; 
            outline: none; 
            text-align: right;
        }

        .checkbox-container { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            cursor: pointer; 
            user-select: none; 
            min-width: 90px;
            justify-content: flex-start;
            flex-shrink: 0;
        }

        .checkbox-container input[type="checkbox"] { 
            width: 15px; 
            height: 15px; 
            cursor: pointer; 
            accent-color: #2c5a9c; 
        }

        .checkbox-container label { 
            font-weight: 700; 
            color: #333; 
            font-size: 14px; 
            font-family: 'Tajawal', sans-serif;
            cursor: pointer; 
        }

        .hidden-input { 
            display: none; 
        }

        .hidden-input.visible { 
            display: inline-block; 
        }

        /* زر الطباعة */
        .print-btn-container { 
            text-align: center; 
            margin-top: 12px; 
            order: 4;
        }

        .print-btn { 
            background-color: #2c5a9c; 
            color: white; 
            border: none; 
            padding: 8px 30px; 
            font-family: 'Tajawal', sans-serif; 
            font-size: 15px; 
            font-weight: 700; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background-color 0.3s; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.1); 
        }

        .print-btn:hover { 
            background-color: #1e3f6d; 
        }

        /* =========================================================
           ✅ إعدادات الطباعة فقط - مُصحّحة
           ⚠️ العرض العادي للصفحة لم يتغير نهائياً
           ========================================================= */
        @media print {
            /* ===== إعدادات عامة للصفحة ===== */
            html, body {
                width: 210mm !important;
                height: 290mm !important;
                max-height: 290mm !important;
                overflow: hidden !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                display: block !important;
            }
            
            .page-container {
                width: 210mm !important;
                height: 288mm !important;
                max-height: 288mm !important;
                box-shadow: none !important;
                padding: 6mm 10mm !important;
                margin: 0 !important;
                border-radius: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                overflow: hidden !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
                break-after: avoid !important;
                break-inside: avoid !important;
                display: flex !important;
                flex-direction: column !important;
            }

            .content {
                height: 100% !important;
                max-height: 100% !important;
                overflow: hidden !important;
                padding-top: 0 !important;
                display: flex !important;
                flex-direction: column !important;
            }

            /* ✅ لا مساحة إضافية - الشعار يظهر من الخلفية */
            .header {
                margin-top: 0 !important;
                margin-bottom: 5px !important;
            }

            /* ✅ مربع الوصف مباشرة بعد العنوان */
            .description-box {
                margin-top: 0 !important;
                min-height: 100px !important;
                max-height: 110px !important;
                margin-bottom: 8px !important;
                padding: 8px !important;
            }

            .description-input {
                min-height: 60px !important;
                max-height: 75px !important;
                font-size: 11px !important;
                line-height: 1.4 !important;
                overflow: hidden !important;
                resize: none !important;
            }

            /* ✅ تصغير الصور - الحل الأساسي */
            .images-grid {
                grid-template-rows: 170px 170px !important;
                gap: 8px !important;
                margin-bottom: 8px !important;
                overflow: hidden !important;
            }

            .image-placeholder {
                overflow: hidden !important;
                max-height: 170px !important;
                height: 170px !important;
                -webkit-clip-path: inset(0 0 0 0 round 12px) !important;
                clip-path: inset(0 0 0 0 round 12px) !important;
                position: relative !important;
            }

            .image-placeholder img {
                max-height: 170px !important;
                height: 170px !important;
                width: 100% !important;
                object-fit: cover !important;
                object-position: center !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                display: block !important;
                -webkit-backface-visibility: hidden !important;
                backface-visibility: hidden !important;
            }

            .image-placeholder:not(.has-image) img {
                display: none !important;
            }

            /* ===== إخفاء عناصر التحكم ===== */
            .print-btn-container { 
                display: none !important; 
            }
            
            .checkbox-container input[type="checkbox"] {
                display: none !important;
            }
            
            .leader-section:not(.active) {
                display: none !important;
            }
            
            .leader-section.active {
                display: flex !important;
            }

            .image-placeholder input[type="file"] { 
                display: none !important; 
            }

            /* ===== إزالة أسهم القوائم ===== */
            .date-select,
            .date-input {
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                appearance: none !important;
                background-image: none !important;
                padding-right: 2px !important;
            }

            /* ===== ضمان طباعة الخلفيات ===== */
            .image-placeholder, 
            .description-box, 
            .info-container { 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }

            .title-input, .info-input, .date-input, .date-select, .manager-input { 
                border: none !important;
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
            
            .description-box,
            .description-input,
            textarea {
                overflow: hidden !important;
                resize: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="content">
            <div class="header">
                <div class="title-area">
                    <div class="title-row">
                        <span>العنوان :</span>
                        <input type="text" class="title-input" id="activityTitle" value="الاجتماع الأول" placeholder="اكتب عنوان النشاط هنا...">
                    </div>
                </div>
            </div>

            <div class="description-box">
                <div class="description-label">الوصف :</div>
                <textarea class="description-input" id="activityDescription" placeholder="اكتب الوصف هنا...">ضمن خطة المدرسة للاستعداد للعام الدراسي الجديد ١٤٤١هـ اجتمع مدير المدرسة بمعلمي المدرسة لمناقشة المستجدات في التعليم وبعض الأمور المتعلقة بسير العملية التعليمية والتربوية ، وطرائق إشراك المعلمين و الأسرة في العملية التعليمية وكيفية رفع مستوى التحصيل الدراسي للطلاب وتوزيع المهام وكيفية سير اليوم الدراسي والاستفادة منه بشكل كامل في مصلحة الطالب.</textarea>
            </div>

            <div class="images-grid">
                <div class="image-placeholder" onclick="document.getElementById('img1').click()">
                    <input type="file" id="img1" accept="image/*" onchange="loadImage(event, this)">
                    <img id="preview1" src="" alt="صورة 1">
                    <div class="placeholder-text">اضغط لاختيار صورة 1</div>
                </div>
                <div class="image-placeholder" onclick="document.getElementById('img2').click()">
                    <input type="file" id="img2" accept="image/*" onchange="loadImage(event, this)">
                    <img id="preview2" src="" alt="صورة 2">
                    <div class="placeholder-text">اضغط لاختيار صورة 2</div>
                </div>
                <div class="image-placeholder" onclick="document.getElementById('img3').click()">
                    <input type="file" id="img3" accept="image/*" onchange="loadImage(event, this)">
                    <img id="preview3" src="" alt="صورة 3">
                    <div class="placeholder-text">اضغط لاختيار صورة 3</div>
                </div>
                <div class="image-placeholder" onclick="document.getElementById('img4').click()">
                    <input type="file" id="img4" accept="image/*" onchange="loadImage(event, this)">
                    <img id="preview4" src="" alt="صورة 4">
                    <div class="placeholder-text">اضغط لاختيار صورة 4</div>
                </div>
            </div>

            <div class="footer">
                <div class="info-container">
                    <div class="info-row">
                        <span class="info-label">المنفذ :</span>
                        <input type="text" class="info-input" id="executor" value="الإدارة المدرسية" placeholder="اكتب اسم المنفذ...">
                    </div>
                    <div class="info-row">
                        <span class="info-label">المستفيدون :</span>
                        <input type="text" class="info-input" id="beneficiaries" value="معلمي وطلاب المدرسة" placeholder="اكتب المستفيدين...">
                    </div>
                    <div class="info-row">
                        <span class="info-label">اليوم والتاريخ :</span>
                        <select class="date-select" id="dayName">
                            <option value="">اختر اليوم</option>
                            <option value="السبت">السبت</option>
                            <option value="الأحد">الأحد</option>
                            <option value="الإثنين">الإثنين</option>
                            <option value="الثلاثاء">الثلاثاء</option>
                            <option value="الأربعاء" selected>الأربعاء</option>
                            <option value="الخميس">الخميس</option>
                            <option value="الجمعة">الجمعة</option>
                        </select>
                        <select class="date-input" id="day">
                            <option value="١">١</option>
                            <option value="٢">٢</option>
                            <option value="٣">٣</option>
                            <option value="٤">٤</option>
                            <option value="٥">٥</option>
                            <option value="٦" selected>٦</option>
                            <option value="٧">٧</option>
                            <option value="٨">٨</option>
                            <option value="٩">٩</option>
                            <option value="١٠">١٠</option>
                            <option value="١١">١١</option>
                            <option value="١٢">١٢</option>
                            <option value="١٣">١٣</option>
                            <option value="١٤">١٤</option>
                            <option value="١٥">١٥</option>
                            <option value="١٦">١٦</option>
                            <option value="١٧">١٧</option>
                            <option value="١٨">١٨</option>
                            <option value="١٩">١٩</option>
                            <option value="٢٠">٢٠</option>
                            <option value="٢١">٢١</option>
                            <option value="٢٢">٢٢</option>
                            <option value="٢٣">٢٣</option>
                            <option value="٢٤">٢٤</option>
                            <option value="٢٥">٢٥</option>
                            <option value="٢٦">٢٦</option>
                            <option value="٢٧">٢٧</option>
                            <option value="٢٨">٢٨</option>
                            <option value="٢٩">٢٩</option>
                            <option value="٣٠">٣٠</option>
                        </select>
                        <span class="date-separator">/</span>
                        <select class="date-input" id="month">
                            <option value="١">١</option>
                            <option value="٢">٢</option>
                            <option value="٣" selected>٣</option>
                            <option value="٤">٤</option>
                            <option value="٥">٥</option>
                            <option value="٦">٦</option>
                            <option value="٧">٧</option>
                            <option value="٨">٨</option>
                            <option value="٩">٩</option>
                            <option value="١٠">١٠</option>
                            <option value="١١">١١</option>
                            <option value="١٢">١٢</option>
                        </select>
                        <span class="date-separator">/</span>
                        <select class="date-input" id="year" style="width: 60px;">
                            <option value="١٤٤٠">١٤٤٠</option>
                            <option value="١٤٤١" selected>١٤٤١</option>
                            <option value="١٤٤٢">١٤٤٢</option>
                            <option value="١٤٤٣">١٤٤٣</option>
                            <option value="١٤٤٤">١٤٤٤</option>
                            <option value="١٤٤٥">١٤٤٥</option>
                            <option value="١٤٤٦">١٤٤٦</option>
                            <option value="١٤٤٧">١٤٤٧</option>
                            <option value="١٤٤٨">١٤٤٨</option>
                            <option value="١٤٤٩">١٤٤٩</option>
                            <option value="١٤٥٠">١٤٥٠</option>
                            <option value="١٤٥١">١٤٥١</option>
                            <option value="١٤٥٢">١٤٥٢</option>
                            <option value="١٤٥٣">١٤٥٣</option>
                            <option value="١٤٥٤">١٤٥٤</option>
                            <option value="١٤٥٥">١٤٥٥</option>
                            <option value="١٤٥٦">١٤٥٦</option>
                            <option value="١٤٥٧">١٤٥٧</option>
                            <option value="١٤٥٨">١٤٥٨</option>
                            <option value="١٤٥٩">١٤٥٩</option>
                            <option value="١٤٦٠">١٤٦٠</option>
                            <option value="١٤٦١">١٤٦١</option>
                            <option value="١٤٦٢">١٤٦٢</option>
                            <option value="١٤٦٣">١٤٦٣</option>
                            <option value="١٤٦٤">١٤٦٤</option>
                            <option value="١٤٦٥">١٤٦٥</option>
                        </select>
                        <span class="date-separator">هـ</span>
                    </div>
                </div>

                <div class="leader-section" id="leaderSection">
                    <div class="checkbox-container">
                        <input type="checkbox" id="leaderCheck" onchange="toggleLeaderInput()">
                        <label for="leaderCheck">رائد النشاط :</label>
                    </div>
                    <input type="text" class="info-input hidden-input" id="leaderName" placeholder="اكتب الاسم...">
                </div>

                <div class="manager-section">
                    <span class="manager-label">مدير المدرسة :</span>
                    <input type="text" class="manager-input" id="managerName" value="أ / عمر بن عبد الله الحماد" placeholder="اكتب اسم مدير المدرسة..." required>
                </div>
            </div>

            <div class="print-btn-container">
                <button class="print-btn" onclick="window.print()">🖨️ طباعة</button>
            </div>
        </div>
    </div>

    <script>
        function toggleLeaderInput() {
            const checkbox = document.getElementById('leaderCheck');
            const leaderInput = document.getElementById('leaderName');
            const leaderSection = document.getElementById('leaderSection');
            if (checkbox.checked) {
                leaderInput.classList.add('visible');
                leaderSection.classList.add('active');
                leaderInput.focus();
            } else {
                leaderInput.classList.remove('visible');
                leaderSection.classList.remove('active');
                leaderInput.value = '';
            }
        }

        function loadImage(event, input) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const placeholder = input.closest('.image-placeholder');
                    const img = placeholder.querySelector('img');
                    img.src = e.target.result;
                    placeholder.classList.add('has-image');
                }
                reader.readAsDataURL(file);
            }
        }

        window.onbeforeprint = function() {
            const managerInput = document.getElementById('managerName');
            if (managerInput.value.trim() === '') {
                alert('الرجاء إدخال اسم مدير المدرسة قبل الطباعة.');
                managerInput.focus();
                return false;
            }
        };
    </script>
</body>
</html>
